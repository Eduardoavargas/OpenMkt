name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @openmkt/server test -- health.test.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
