name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: openmkt
          POSTGRES_PASSWORD: openmkt
          POSTGRES_DB: openmkt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openmkt -d openmkt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://openmkt:openmkt@localhost:5432/openmkt_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @openmkt/server test -- health.test.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @openmkt/database test:integration -- schema.integration.test.ts
